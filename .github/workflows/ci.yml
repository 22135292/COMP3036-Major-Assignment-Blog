name: Major Assignment CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      E2E: true
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: file:${{ github.workspace }}/packages/db/prisma/dev.db
      PASSWORD: "123"
      JWT_SECRET: major-assignment-ci-secret

      # The upload request is mocked by Playwright.
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'e2e-cloud' }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || 'e2e-key' }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'e2e-secret' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PNPM
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db db:generate

      - name: Prepare database
        run: |
          pnpm --filter @repo/db db:push
          pnpm --filter @repo/db db:seed

      - name: Check TypeScript types
        run: pnpm turbo run check-types --concurrency=1

      - name: Run unit and component tests
        run: |
          pnpm --filter @repo/utils test
          pnpm --filter @repo/ui test
          pnpm --filter @repo/web test

      - name: Build applications
        run: pnpm turbo build

      - name: Install Playwright Chromium
        run: pnpm --filter @repo/playwright exec playwright install chromium --with-deps

      - name: Run end-to-end tests
        env:
        CI: true
        run: >
          pnpm --filter @repo/playwright exec playwright test
          --project=chromium
          --project=chromium-web-home
          --project=chromium-web

      - name: Upload Playwright HTML report
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: playwright-html-report
    path: tests/playwright/playwright-report/
    retention-days: 14
    if-no-files-found: warn

  -name: Upload Playwright test results
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: playwright-test-results
    path: tests/playwright/test-results/
    retention-days: 14
    if-no-files-found: ignore