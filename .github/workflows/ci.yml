name: Major Assignment CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CI: true
      E2E: true
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: file:${{ github.workspace }}/packages/db/prisma/dev.db
      PASSWORD: "123"
      JWT_SECRET: major-assignment-ci-secret
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm --filter @repo/db db:push
          pnpm --filter @repo/db db:seed

      - name: Check types
        run: pnpm turbo run check-types --concurrency=1

      - name: Install Playwright Chromium
        run: pnpm --filter @repo/playwright exec playwright install chromium --with-deps

      - name: Run unit and component tests
        run: pnpm turbo run test --concurrency=1

      - name: Build applications
        run: pnpm turbo build

      - name: Run end-to-end tests
        run: pnpm --filter @repo/playwright exec playwright test --grep-invert "upload an image" --project=chromium --project=chromium-web-home --project=chromium-web

      - name: Run Cloudinary upload test
        if: ${{ env.CLOUDINARY_CLOUD_NAME != '' }}
        run: pnpm --filter @repo/playwright exec playwright test tests/admin/post-upload.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          if-no-files-found: ignore
