name: Autograding Tests
"on":
  - push
  - workflow_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    env:
      # For recording and parallelization to work you must set your CYPRESS_RECORD_KEY
      # in GitHub repo → Settings → Secrets → Actions
      COURSE: full-stack-development-comp3036-2025
      E2E: true
      CI: true
      DATABASE_URL: file:./dev.db
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PASSWORD: 123
      JWT_SECRET: secret
      # NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      # NEXTAUTH_URL: http://127.0.0.1:3001/
      # VERCEL_URL: http://127.0.0.1:3001/
      #TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
      #TURBO_TEAM: team_FXFYQlL6HSM7CAamFdBZ5A6x
      SKIP_ENV_VALIDATION: true
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install PNPM 📦
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies 🧪
        run: pnpm install
      - name: Install Playwright Browsers
        working-directory: tests/playwright
        run: pnpm playwright install chromium --with-deps
      - name: Push Database 📦
        run: pnpm --filter @repo/db db:push
      - name: Build the project 🏗
        run: pnpm turbo build

      ####################
      # UTILS TESTS
      ####################

      - name: Test - Utils
        id: testUtils
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: packages/utils
          test-name: Unit 1 - Utils
          command: pnpm test
          timeout: 10
          max-score: 1

      # - name: Test - Ui
      #   id: testUi
      #   uses: WesternSydneyUniversity/autograding-command-grader@v2
      #   continue-on-error: true
      #   with:
      #     working-directory: packages/ui
      #     test-name: Unit 2 - UI
      #     command: pnpm test
      #     timeout: 10
      #     max-score: 1

      # - name: Test - Web
      #   id: testWeb
      #   uses: WesternSydneyUniversity/autograding-command-grader@v2
      #   continue-on-error: true
      #   with:
      #     working-directory: apps/web
      #     test-name: Unit 3 - Web Components
      #     command: pnpm test
      #     timeout: 10
      #     max-score: 1

      ####################
      # Lecture - Pages
      ####################
      - name: Exercise - Pages
        id: npm1
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Pages and Layouts
          courseId: ${{env.COURSE}}
          sectionId: exercise-layouts-and-pages-in-next-js
          command: pnpm playwright test -- --grep "@pages"
          timeout: 10
          max-score: 1

      - name: Exercise - Images
        id: npm2
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Images and Fonts
          courseId: ${{env.COURSE}}
          sectionId: exercise-fonts-and-images-in-next-js
          command: pnpm playwright test -- --grep "@images"
          timeout: 10
          max-score: 1

      - name: Exercise - Styles
        id: npm3
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Styles
          courseId: ${{env.COURSE}}
          sectionId: exercise-styling-in-next-js
          command: pnpm playwright test -- --grep "@styles"
          timeout: 10
          max-score: 1

      - name: Exercise - Components
        id: npm4
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Server and Client Components
          courseId: ${{env.COURSE}}
          sectionId: exercise-server-vs-client-components-in-next-js
          command: pnpm playwright test -- --grep "@components"
          timeout: 10
          max-score: 1

      - name: Exercise - SQL vs NoSQL
        id: npm5
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: SQL vs NoSQL Tests
          courseId: ${{env.COURSE}}
          sectionId: exercise-databases-in-databases
          command: pnpm playwright test -- --grep "@databases"
          timeout: 10
          max-score: 1

      - name: Exercise - Prisma
        id: npm6
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Prisma and ORM Tests
          courseId: ${{env.COURSE}}
          sectionId: exercise-prisma-and-orm-in-databases
          command: pnpm playwright test -- --grep "@prisma"
          timeout: 10
          max-score: 1

      - name: Exercise - Search and Pagination
        id: npm7
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Search and Pagination Tests
          courseId: ${{env.COURSE}}
          sectionId: exercise-search-and-pagination-in-databases
          command: pnpm playwright test -- --grep "@pagination"
          timeout: 10
          max-score: 1

      - name: Exercise - Mutations
        id: npm8
        uses: WesternSydneyUniversity/autograding-command-grader@v3
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Mutations Tests
          courseId: ${{env.COURSE}}
          sectionId: exercise-mutations-in-databases
          command: pnpm playwright test -- --grep "@mutations"
          timeout: 10
          max-score: 1

      - name: Autograding Reporter
        uses: education/autograding-grading-reporter@v1
        env:
          NPM1_RESULTS: "${{steps.npm1.outputs.result}}"
          NPM2_RESULTS: "${{steps.npm2.outputs.result}}"
          NPM3_RESULTS: "${{steps.npm3.outputs.result}}"
          NPM4_RESULTS: "${{steps.npm4.outputs.result}}"
          NPM5_RESULTS: "${{steps.npm5.outputs.result}}"
          NPM6_RESULTS: "${{steps.npm6.outputs.result}}"
          NPM7_RESULTS: "${{steps.npm7.outputs.result}}"
          NPM8_RESULTS: "${{steps.npm8.outputs.result}}"
          TESTUTILS_RESULTS: "${{steps.testUtils.outputs.result}}"
        with:
          runners: npm1,npm2,npm3,npm4,npm5,npm6,npm7,npm8,testUtils
